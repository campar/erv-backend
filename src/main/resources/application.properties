spring.application.name=ERV
app.configuration.timezone-id=Europe/Belgrade
server.port=8443
# HTTPS is off by default; set SSL_ENABLED=true and point SSL_KEY_STORE to a PKCS12 keystore to enable it
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:ervserver}

# Datasource postgres
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/erv}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

#logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Base64-encoded HMAC key used to sign JWTs (required)
jwt.secret=${JWT_SECRET}
#	1000 * 60 * 15 = 900000
jwt.expiration=900000
#	1000 * 60 * 60 * 24 * 7 = 604800000
#	1000 * 60 * 60 * 25 * 30 = 2592000000
jwt.refreshToken=2592000000
#spring.jpa.open-in-view = false
# Comma-separated list of origins allowed to call the API
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,https://localhost:4200}
# Basic auth credentials used by the tablet terminals (password required)
device.user-name=${DEVICE_USER_NAME:tablet}
device.password=${DEVICE_PASSWORD}

login.attempt.count=5
#	1000 * 60 * 15 = 900000 - 15 minutes lock
account.lock.time=900000
brute.force.protection.feature.on=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Fill an empty database with demo data on startup (users, departments, devices, shifts)
app.seed-demo-data=${SEED_DEMO_DATA:false}
# Also generate months of random attendance records (slow)
app.seed-demo-timetables=${SEED_DEMO_TIMETABLES:false}
