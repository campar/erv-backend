spring.application.name=ERV
app.configuration.timezone-id=Europe/Belgrade
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=ervserver

# Datasource postgres
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.datasource.url=jdbc:postgresql://localhost:5432/erv
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.sql.init.mode=always
spring.sql.init.continue-on-error=false

# Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=INFO
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
#spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.format_sql=true

#logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

jwt.secret=ZXJ2LWRldmVsb3BtZW50LXNlY3JldC1rZXktY2hhbmdlLW1l
#	1000 * 60 * 15 = 900000
jwt.expiration=900000
#	1000 * 60 * 60 * 24 * 7 = 604800000
#	1000 * 60 * 60 * 25 * 30 = 2592000000
jwt.refreshToken=2592000000
#spring.jpa.open-in-view = false
frontend.address=https://localhost:4200
device.user-name=tablet
device.password=changeme

login.attempt.count=5
#	1000 * 60 * 15 = 900000 - 15 minutes lock
account.lock.time=900000
brute.force.protection.feature.on=true

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
